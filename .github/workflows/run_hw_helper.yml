name: Run Home Work Helper 

on:
  push:
    branches:
      - main
    paths:
      - 'Tasks/**'  # Trigger on changes to files inside the Tasks folder

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository (app folder + Tasks folder)
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: 'false'
          fetch-depth: 1  # Shallow clone to save time

      # Step 2: Cache Python dependencies
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            venv/
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Step 3: Set up Python environment and install dependencies
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r APP/requirements.txt
        env:
          APP_SCRIPT_ENDPOINT: ${{ secrets.APP_SCRIPT_ENDPOINT }}  # Inject secret into environment variable
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  

      # Step 4: Cache the App directory and the Tasks directory (including the .git directory)
      - name: Cache App and Tasks directory
        uses: actions/cache@v3
        with:
          path: |
            .git
            APP/**    # Cache the entire App directory
          key: ${{ runner.os }}-repo-${{ hashFiles('APP/**') }}
          restore-keys: |
            ${{ runner.os }}-repo-

      # Step 5: Run the Python script to generate files in the Generated_Files folder
      - name: Run Python script to generate files
        run: |
          python APP/jarvis.py

      - name: Remove processed task file (without committing)
        run: |
          # Assuming task file is located in 'Tasks/'
          rm -f Tasks/*.json
          echo "File deleted successfully"

     # Step 6: Add and stage all files in the Generated_Files directory
      - name: Stage all generated files in Academic_Work folder
        run: |
          git add Academic_Work/*

      # Step 7: Commit and push the generated files to the same repo
      - name: Commit and push generated files
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Commit the new files
          git commit -m "Add new HW generated files to Academic_Work"

          # Push changes to the repo
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
