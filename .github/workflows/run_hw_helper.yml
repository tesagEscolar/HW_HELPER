name: Run Home Work Helper 

on:
  push:
    branches:
      - main
    paths:
      - 'Tasks/**'  # Trigger on changes to files inside the Tasks folder
permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository (app folder + Tasks folder)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'false'
          fetch-depth: 1  # Shallow clone to save time
            # Check if the task.json file was deleted
      
      # Check if the 'Tasks' folder exists
      - name: Check if Tasks folder exists
        id: check_folder
        run: |
          if [ ! -d "Tasks" ]; then
            echo "Tasks folder does not exist. Cancelling execution."
            exit 0  # Exit early to prevent further execution
          fi
          echo "Tasks folder exists. Proceeding with task processing."

      # Step 2: Cache Python dependencies
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            venv/
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Step 3: Set up Python environment and install dependencies
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r APP/requirements.txt


      # Step 4: Cache the App directory and the Tasks directory (including the .git directory)
      - name: Cache App and Tasks directory
        uses: actions/cache@v3
        with:
          path: |
            .git
            APP/**    # Cache the entire App directory
          key: ${{ runner.os }}-repo-${{ hashFiles('APP/**') }}
          restore-keys: |
            ${{ runner.os }}-repo-

      # Step 5: Run the Python script to generate files in the Generated_Files folder
      - name: Run Python script to generate files
        run: |
          python APP/main.py
        env:
          APP_SCRIPT_ENDPOINT: ${{ secrets.APP_SCRIPT_ENDPOINT }}  # Inject secret into environment variable
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  
        

